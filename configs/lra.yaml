# Canonical LRA reproduction settings for this released code package.

listops:
  seed: 1919
  pipeline: ssm_benchmark_listops_cache
  length: 2048
  d_model: 64
  n_layers: 10
  d_state: 64
  d_conv: 4
  expand: 3
  batch_size: 64
  epochs: 50
  lr: 0.0001
  weight_decay: 0.01
  pool: mean
  head_input: spike
  scheduler: ssm_benchmark_epoch_cosine
  warmup_epochs: 0

text:
  seed: 1919
  pipeline: ssm_benchmark_imdb_cache
  length: 4096
  d_model: 64
  n_layers: 6
  d_state: 64
  d_conv: 4
  expand: 2
  batch_size: 32
  epochs: 100
  lr: 0.0005
  weight_decay: 0.01
  pool: mean
  head_input: spike
  scheduler: ssm_benchmark_epoch_cosine
  warmup_epochs: 0

retrieval:
  seed: 42
  pipeline: s4_main_aan_cache
  length: 4096
  d_model: 256
  n_layers: 6
  d_state: 64
  d_conv: 4
  expand: 2
  batch_size: 16
  epochs: 20
  lr: 0.001
  weight_decay: 0.01
  pool: mean
  head_input: cont
  scheduler: step_cosine
  warmup_steps: 1000

image:
  seed: 42
  pipeline: s4_cifar_grayscale
  augmentation: crop_flip
  validation_split: 0.1
  length: 1024
  d_model: 256
  n_layers: 6
  d_state: 64
  d_conv: 4
  expand: 2
  batch_size: 128
  epochs: 200
  lr: 0.001
  weight_decay: 0.0
  pool: mean
  head_input: cont
  scheduler: step_cosine
  warmup_ratio: 0.1

pathfinder:
  seed: 1919
  input: continuous
  resolution: 32
  level: hard
  split_seed: 42
  center: true
  length: 1024
  d_model: 128
  n_layers: 6
  d_state: 64
  d_conv: 4
  expand: 4
  batch_size: 32
  epochs: 200
  lr: 0.0001
  weight_decay: 0.01
  pool: mean
  head_input: spike
  scheduler: step_cosine
  warmup_steps: 5
